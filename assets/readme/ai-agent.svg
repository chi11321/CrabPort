<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="agent-title agent-desc">
  <title id="agent-title">CrabPort's built-in lightweight AI agent</title>
  <desc id="agent-desc">Left: a tool call awaiting approval — working directory, the exact command, and what it is for, with Deny and Allow buttons — and, after allowing, the result card with the exit code and output. Right: the agent's tool list (terminal, local files, network, tunnels, SFTP) and the per-tool permission control (Confirm / Allow / Deny).</desc>

  <rect width="1200" height="540" rx="26" fill="#14161c"/>
  <rect x="1" y="1" width="1198" height="538" rx="25" fill="none" stroke="#23262f" stroke-width="1"/>

  <defs>
    <marker id="agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7080"/>
    </marker>
    <symbol id="agent-check" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7" fill="#4ade80"/>
      <path d="M4.5 8.5 l2.5 2.5 l4.5 -5" fill="none" stroke="#0f1116" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <text x="64" y="56"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" letter-spacing="3" fill="#6366f1" font-weight="600">
    BUILT-IN LIGHTWEIGHT AI AGENT
  </text>
  <text x="64" y="88"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26" font-weight="600" fill="#e6e9ef">
    Approval first, then execution
  </text>

  <!-- Left: the approval card -->
  <g transform="translate(64 120)">
    <rect width="490" height="180" rx="10" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4"/>
    <path d="M24 20 c1.2 6.4 3.2 8.4 9.6 9.6 c-6.4 1.2 -8.4 3.2 -9.6 9.6 c-1.2 -6.4 -3.2 -8.4 -9.6 -9.6 c6.4 -1.2 8.4 -3.2 9.6 -9.6 z" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="42" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#818cf8">Run a command</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7080">Directory</text>
      <text x="88" y="64" font-size="12" fill="#c1c5d0">/var/www</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7080">Command</text>
      <text x="88" y="92" font-size="13" fill="#e6e9ef">systemctl restart nginx</text>
      <text x="20" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6b7080">Expected</text>
      <text x="88" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b90a0">apply the new configuration</text>
    </g>

    <rect x="336" y="140" width="64" height="24" rx="6" fill="none" stroke="#2e333f"/>
    <text x="368" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b90a0">Deny</text>
    <rect x="406" y="140" width="64" height="24" rx="6" fill="#6366f1"/>
    <text x="438" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0f1116">Allow</text>
  </g>

  <!-- Connector: after allowing -->
  <line x1="309" y1="308" x2="309" y2="342" stroke="#6b7080" stroke-width="1.5" marker-end="url(#agent-arrow)"/>
  <text x="325" y="330"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#6b7080">after Allow</text>

  <!-- The result card -->
  <g transform="translate(64 352)">
    <rect width="490" height="150" rx="10" fill="#6366f1" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.4"/>
    <use href="#agent-check" x="446" y="16" width="18" height="18"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#818cf8">Run a command</text>
    <rect x="24" y="52" width="442" height="74" rx="6" fill="#0f1116" stroke="#23262f"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="38" y="76" fill="#6b7080">[exit code: 0]</text>
      <text x="38" y="98" fill="#4ade80">Active: active (running) since 03:14</text>
    </g>
  </g>

  <!-- Right: the tool list -->
  <g transform="translate(620 120)">
    <text x="0" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b90a0" font-weight="600">TOOLS</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="44" font-size="12" fill="#6b7080">Terminal</text>
      <text x="200" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">terminal_read · terminal_exec · terminal_run</text>
      <text x="0" y="72" font-size="12" fill="#6b7080">Local</text>
      <text x="200" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">read_file · read_directory</text>
      <text x="0" y="100" font-size="12" fill="#6b7080">Network</text>
      <text x="200" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">fetch (optionally via a tunnel)</text>
      <text x="0" y="128" font-size="12" fill="#6b7080">Tunnels</text>
      <text x="200" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">tunnel_list / create / open / close / delete</text>
      <text x="0" y="156" font-size="12" fill="#6b7080">SFTP</text>
      <text x="200" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">sftp_list · sftp_download · sftp_upload</text>
    </g>

    <!-- Per-tool permissions -->
    <text x="0" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b90a0" font-weight="600">PER-TOOL PERMISSIONS</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c1c5d0">
      <text x="0" y="244">terminal_exec</text>
      <text x="0" y="296">terminal_run</text>
    </g>

    <!-- Segmented control mock: Confirm | Allow | Deny -->
    <g transform="translate(180 224)">
      <rect width="336" height="32" rx="8" fill="#1c1f27"/>
      <rect x="112" y="4" width="112" height="24" rx="5" fill="#0f1116"/>
      <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
        <text x="56" y="21" fill="#8b90a0">Confirm</text>
        <text x="168" y="21" fill="#e6e9ef" font-weight="600">Allow</text>
        <text x="280" y="21" fill="#8b90a0">Deny</text>
      </g>
    </g>
    <g transform="translate(180 276)">
      <rect width="336" height="32" rx="8" fill="#1c1f27"/>
      <rect x="4" y="4" width="112" height="24" rx="5" fill="#0f1116"/>
      <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
        <text x="60" y="21" fill="#e6e9ef" font-weight="600">Confirm</text>
        <text x="168" y="21" fill="#8b90a0">Allow</text>
        <text x="280" y="21" fill="#8b90a0">Deny</text>
      </g>
    </g>

    <text x="0" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b90a0">
      Trusted tools stop asking; risky ones keep asking every time.
    </text>
  </g>

  <text x="64" y="524"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#6b7080">
    Tools run on background threads and never write into the terminal you are watching; long conversations compact automatically, so the work keeps going.
  </text>
</svg>
