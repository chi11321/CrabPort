<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How a CrabPort connection is wired</title>
  <desc id="arch-desc">Host config (with proxy + credentials) connects through the proxy layer to an SSH, Telnet, or serial backend, which feeds a terminal tab. SFTP, tunnels, and a command palette attach to the SSH backend.</desc>

  <rect width="1200" height="380" rx="26" fill="#14161c"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#23262f" stroke-width="1"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="64" y="56"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" letter-spacing="3" fill="#6366f1" font-weight="600">
    HOW IT FITS TOGETHER
  </text>
  <text x="64" y="86"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="26" font-weight="600" fill="#e6e9ef">
    One connection, every tool attached
  </text>

  <!-- ===== Row: config card ===== -->
  <g transform="translate(64 130)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">HOST CONFIG</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">user@10.0.4.51:22</text>
      <text x="16" y="74" fill="#818cf8">proxy: socks5://…</text>
      <text x="16" y="94" fill="#818cf8">creds: AES-256-GCM</text>
      <text x="16" y="112" fill="#6b7080" font-size="11">sqlite · config.toml</text>
    </g>
  </g>

  <!-- arrow config -> proxy -->
  <line x1="284" y1="190" x2="338" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== proxy layer ===== -->
  <g transform="translate(344 130)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">PROXY LAYER</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">direct</text>
      <text x="16" y="74">SOCKS5</text>
      <text x="16" y="94">HTTP(S) CONNECT</text>
    </g>
  </g>

  <!-- arrow proxy -> backends -->
  <line x1="524" y1="190" x2="578" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== backends stack ===== -->
  <g transform="translate(584 118)">
    <rect x="0" y="0" width="200" height="144" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">BACKEND</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">SSH · russh</text>
      <text x="16" y="74">Telnet · RFC 854</text>
      <text x="16" y="94">Serial · serialport</text>
      <text x="16" y="118" fill="#6b7080" font-size="11">shared tokio runtime</text>
    </g>
  </g>

  <!-- arrow backend -> terminal tab -->
  <line x1="784" y1="190" x2="838" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== terminal tab ===== -->
  <g transform="translate(844 130)">
    <rect x="0" y="0" width="292" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">TERMINAL TAB</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54"><tspan fill="#4ade80" font-weight="600">$</tspan> alacritty_terminal PTY</text>
      <text x="16" y="74" fill="#818cf8">+ SFTP panel</text>
      <text x="16" y="94" fill="#818cf8">+ tunnels (L/R/D)</text>
      <text x="16" y="112" fill="#818cf8">+ history &amp; snippets</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="64" y="316"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="15" fill="#8b90a0">
    Each host carries its own proxy + credentials. SSH backends additionally expose SFTP, tunnels, and shell history.
  </text>
</svg>
