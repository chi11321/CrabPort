<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CrabPort 连接是如何串起来的</title>
  <desc id="arch-desc">主机配置（含代理与凭据）经由代理层连接到 SSH / Telnet / 串口后端，再驱动一个终端标签页。SFTP、隧道与命令面板挂载到 SSH 后端。</desc>

  <rect width="1200" height="380" rx="26" fill="#14161c"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#23262f" stroke-width="1"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <text x="64" y="56"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" letter-spacing="3" fill="#6366f1" font-weight="600">
    如何串起来
  </text>
  <text x="64" y="86"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif"
        font-size="26" font-weight="600" fill="#e6e9ef">
    一条连接，所有工具挂载其上
  </text>

  <!-- 主机配置 -->
  <g transform="translate(64 130)">
    <rect x="0" y="0" width="220" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">主机配置</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">user@10.0.4.51:22</text>
      <text x="16" y="74" fill="#818cf8">代理: socks5://…</text>
      <text x="16" y="94" fill="#818cf8">凭据: AES-256-GCM</text>
      <text x="16" y="112" fill="#6b7080" font-size="11">sqlite · config.toml</text>
    </g>
  </g>

  <line x1="284" y1="190" x2="338" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 代理层 -->
  <g transform="translate(344 130)">
    <rect x="0" y="0" width="180" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">代理层</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">直连</text>
      <text x="16" y="74">SOCKS5</text>
      <text x="16" y="94">HTTP(S) CONNECT</text>
    </g>
  </g>

  <line x1="524" y1="190" x2="578" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 后端 -->
  <g transform="translate(584 118)">
    <rect x="0" y="0" width="200" height="144" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">后端</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54">SSH · russh</text>
      <text x="16" y="74">Telnet · RFC 854</text>
      <text x="16" y="94">串口 · serialport</text>
      <text x="16" y="118" fill="#6b7080" font-size="11">共享 tokio 运行时</text>
    </g>
  </g>

  <line x1="784" y1="190" x2="838" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 终端标签页 -->
  <g transform="translate(844 130)">
    <rect x="0" y="0" width="292" height="120" rx="10" fill="#0f1116" stroke="#23262f"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#8b90a0" letter-spacing="1">终端标签页</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c1c5d0">
      <text x="16" y="54"><tspan fill="#4ade80" font-weight="600">$</tspan> alacritty_terminal PTY</text>
      <text x="16" y="74" fill="#818cf8">+ SFTP 面板</text>
      <text x="16" y="94" fill="#818cf8">+ 隧道（L/R/D）</text>
      <text x="16" y="112" fill="#818cf8">+ 历史与片段</text>
    </g>
  </g>

  <text x="64" y="316"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif"
        font-size="15" fill="#8b90a0">
    每条主机自带代理与凭据；SSH 后端额外暴露 SFTP、隧道与命令历史。
  </text>
</svg>
