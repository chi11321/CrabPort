[package]
name = "crabport-terminal"
version.workspace = true
edition.workspace = true

[dependencies]
crabport-sftp = { path = "../crabport-sftp" }
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
parking_lot = "0.12"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
libc = "0.2.186"
smol = "2.0.2"
async-channel = "2.5.0"
async-broadcast = "0.7.2"
# `BackendEvent::Data` carries `bytes::Bytes` so backends that already hold one
# (russh hands out `Bytes` for every SSH channel packet) can broadcast it
# without copying, and cloned payloads become a refcount bump.
bytes = "1"
sysinfo = { version = "0.35", default-features = false, features = ["system", "network", "disk"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "fs", "time"] }
